# Render Infrastructure-as-Code Blueprint for SMART-BP Tracker
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-bp-tracker
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free # Render Free Tier ($0/month)
    region: oregon # or ohio, frankfurt, singapore
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000
      - key: MAX_UPLOAD_SIZE_MB
        value: 20
      - key: DATABASE_PATH
        value: /var/data/bp_tracker.db
      # Security & Access Control
      # Set APP_ACCESS_TOKEN in Render Dashboard to establish your private passkey
      - key: APP_ACCESS_TOKEN
        generateValue: true # Render automatically generates a secure random 32-character key if not set!
      - key: BP_USER_ID
        value: personal_owner
      # - key: CORS_ORIGINS
      #   value: https://smart-bp-tracker.onrender.com
      # Optional: Cloud Database configuration via Supabase (100% Free tier)
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_ROLE_KEY
      #   sync: false

    # NOTE: Render Free Tier ($0) does not support persistent disks.
    # On the Free tier, SQLite stores data in /var/data/bp_tracker.db (or connect Supabase for free persistent cloud storage).
    # If upgrading to a paid Render Starter plan ($7/mo), you can uncomment the disk block below:
    # disk:
    #   name: bp-data
    #   mountPath: /var/data
    #   sizeGB: 1
